services:
  gmaps-resolver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gmaps-resolver
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CACHE_DB_PATH: /app/data/gmaps_resolver.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
